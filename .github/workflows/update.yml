name: Update calendar
on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [build_ics.py, .github/workflows/update.yml]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build_ics.py
      - name: Commit if changed
        run: |
          # DTSTAMP changes every run; only commit when event content changed
          if git diff --quiet -I '^DTSTAMP:' -- windsong-ranch-hoa.ics; then
            git checkout -- windsong-ranch-hoa.ics; echo "No changes"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add windsong-ranch-hoa.ics
          git commit -m "Update Windsong calendar"
          git push
